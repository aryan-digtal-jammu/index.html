<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan Jammu Dtigal - Task Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #193b70;
      color: white;
      padding: 24px;
    }
    header h1 { margin: 0 0 8px; }
    main {
      max-width: 950px;
      margin: auto;
      padding: 22px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .card, form, .task {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
    }
    .card h2 { margin: 8px 0 0; }
    form { margin-top: 22px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      background: #2458a6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .task { margin-top: 12px; }
    .task p { color: #64748b; }
    .delete { background: #dc3545; }
    @media(max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Aryan Jammu Dtigal</h1>
    <p>Daily Team Task Manager</p>
  </header>

  <main>
    <div class="stats">
      <div class="card">Total Tasks<h2 id="total">0</h2></div>
      <div class="card">Pending<h2 id="pending">0</h2></div>
      <div class="card">In Progress<h2 id="progress">0</h2></div>
      <div class="card">Completed<h2 id="completed">0</h2></div>
    </div>

    <form id="taskForm">
      <h2>+ Assign New Task</h2>
      <input id="title" placeholder="Task ka naam" required>
      <input id="details" placeholder="Task ki details">
      <select id="member">
        <option>Member 1</option>
        <option>Member 2</option>
        <option>Member 3</option>
        <option>Member 4</option>
      </select>
      <label>Deadline</label>
      <input id="deadline" type="date">
      <button type="submit">Assign Task</button>
    </form>

    <section>
      <h2>Team Tasks</h2>
      <div id="taskList"></div>
    </section>
  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem("aryanTasks") || "[]");
    let nextId = tasks.reduce((max, t) => Math.max(max, t.id), 0) + 1;

    const $ = id => document.getElementById(id);

    function save() {
      localStorage.setItem("aryanTasks", JSON.stringify(tasks));
      render();
    }

    function render() {
      $("total").textContent = tasks.length;
      $("pending").textContent =
        tasks.filter(t => t.status === "Pending").length;
      $("progress").textContent =
        tasks.filter(t => t.status === "In Progress").length;
      $("completed").textContent =
        tasks.filter(t => t.status === "Completed").length;

      $("taskList").replaceChildren();

      tasks.forEach(task => {
        const box = document.createElement("article");
        box.className = "task";

        const title = document.createElement("h3");
        title.textContent = task.title;
        box.append(title);

        const details = document.createElement("p");
        details.textContent =
          `${task.member} · ${task.details || "No details"} · Deadline: ${task.deadline || "Not set"}`;
        box.append(details);

        const status = document.createElement("select");
        ["Pending", "In Progress", "Completed"].forEach(s => {
          const option = document.createElement("option");
          option.value = s;
          option.textContent = s;
          option.selected = task.status === s;
          status.append(option);
        });
        status.addEventListener("change", () => {
          task.status = status.value;
          save();
        });
        box.append(status);

        const del = document.createElement("button");
        del.textContent = "Delete Task";
        del.className = "delete";
        del.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
        });
        box.append(del);

        $("taskList").append(box);
      });
    }

    $("taskForm").addEventListener("submit", e => {
      e.preventDefault();

      tasks.push({
        id: nextId++,
        title: $("title").value.trim(),
        details: $("details").value.trim(),
        member: $("member").value,
        deadline: $("deadline").value,
        status: "Pending"
      });

      save();
      e.target.reset();
    });

    render();
  </script>
</body>
</html>
